# ==========================================================
# 🚀 Azure Pipeline CI/CD - Backend FastAPI (back_akaza)
# Autenticación directa con Docker y ACR (Sin Service Principal)
# ==========================================================

trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  ACR_NAME: 'acrakazamrkwvoqqvp7fs'
  ACR_LOGIN_SERVER: 'acrakazamrkwvoqqvp7fs.azurecr.io'
  ACR_PASSWORD: '6E6TPQixQsA67O6v4Ogeq6Dfvcn30IBUecVz1Vt7WRaOlUDFdlYIJQQJ99CJACHrzpqEqg7NAAACAZCRPiIl'
  IMAGE_NAME: 'akaza-backend'
  TAG: '$(Build.BuildId)'

steps:
  - script: |
      set -e
      echo "==> Iniciando sesión en Docker con Azure Container Registry..."
      echo "$(ACR_PASSWORD)" | docker login $(ACR_LOGIN_SERVER) -u $(ACR_NAME) --password-stdin

      echo "==> Construyendo imagen Docker de producción para FastAPI..."
      docker build \
        -t $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):latest \
        -t $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(TAG) \
        -f Dockerfile .

      echo "==> Subiendo imágenes a ACR..."
      docker push $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):latest
      docker push $(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(TAG)

      echo "==> Cierre de sesión de Docker..."
      docker logout $(ACR_LOGIN_SERVER)
    displayName: 'Docker Login, Build and Push to ACR'
